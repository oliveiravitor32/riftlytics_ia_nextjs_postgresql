name: Resumo diário

# Main trigger: cron-job.org calls workflow_dispatch at 09:17 in Brasília,
# closing the game day (10:00 to 09:59). GitHub's own schedule below is only a
# backup (it can run late or not at all); bot/send.mjs sends each day once.
on:
  schedule:
    - cron: '37 12 * * *'
  # "Run workflow" button: resend after a failure, or send a past day's summary
  workflow_dispatch:
    inputs:
      dia:
        description: 'Dia de jogo do resumo (AAAA-MM-DD). Vazio = o dia que está fechando, com o fechamento antes.'
        required: false
        default: ''
      forcar:
        description: 'Enviar mesmo se o resumo desse dia já foi enviado'
        type: boolean
        default: false

concurrency: resumo-diario

jobs:
  resumo:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Day's final PDL snapshot and new matches, before the summary reads them
      - name: Fechamento do dia
        # A past day is already closed
        if: ${{ !inputs.dia }}
        run: |
          curl --fail-with-body --max-time 320 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/fechamento"

      # Day being summarized: the one given, or the game day that is ending.
      # Minus 11 h so a run delayed past 10:00 still picks the day that ended.
      - name: Dia do resumo
        id: dia
        run: |
          DIA="${{ inputs.dia }}"
          if [ -z "$DIA" ]; then DIA=$(TZ=America/Sao_Paulo date -d '-11 hours' +%F); fi
          echo "dia=$DIA" >> "$GITHUB_OUTPUT"

      - name: Instalar o bot
        working-directory: bot
        run: npm ci --no-audit --no-fund

      - name: Enviar resumo no WhatsApp
        working-directory: bot
        run: npm run send
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BOT_SESSION_KEY: ${{ secrets.BOT_SESSION_KEY }}
          RESUMO_DIA: ${{ steps.dia.outputs.dia }}
          RESUMO_FORCAR: ${{ inputs.forcar }}
